<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Full Budget</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(to right, #6a11cb, #2575fc); margin: 0; padding: 0; }
    .container { max-width: 900px; margin: 40px auto; background-color: #fff; border-radius: 15px; padding: 30px 40px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; font-size: 2.5em; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background-color: #3498db; color: #fff; border-radius: 8px; }
    tr:hover { background-color: #f1f1f1; }
    .budget-summary { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 15px; margin-top: 20px; }
    .card { flex: 1 1 250px; background-color: #ecf0f1; padding: 20px; border-radius: 10px; text-align: center; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
    .back-btn { display: block; margin: 20px auto; padding: 12px 25px; background-color: #3498db; color: white; text-decoration: none; text-align: center; border-radius: 8px; font-size: 16px; transition: 0.3s; }
    .back-btn:hover { background-color: #2980b9; }
    .Food { background-color: #f39c12; color: #fff; }
    .Home { background-color: #16a085; color: #fff; }
    .Work { background-color: #2980b9; color: #fff; }
    .Fun { background-color: #8e44ad; color: #fff; }
    .Other { background-color: #2c3e50; color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Full Budget Overview</h1>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Category</th>
          <th>Amount (Rs.)</th>
        </tr>
      </thead>
      <tbody>
        {% for expense in expenses %}
        <tr>
          <td>{{ expense.name }}</td>
          <td>{{ expense.category }}</td>
          <td>{{ expense.amount }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>

    <div class="budget-summary">
      <div class="card">Total Spent: Rs.{{ summary[1] }}</div>
      <div class="card">Remaining Budget: Rs.{{ summary[2] }}</div>
      <div class="card">Daily Budget Left: Rs.{{ summary[3] }}</div>
    </div>

    <a href="{{ url_for('index') }}" class="back-btn">Back to Tracker</a>
  </div>
</body>
</html>
