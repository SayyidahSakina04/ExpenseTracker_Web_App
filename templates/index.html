<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expense Tracker</title>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #6a11cb, #2575fc);
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      background-color: #fff;
      border-radius: 15px;
      padding: 30px 40px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    h1 { text-align: center; color: #2c3e50; margin-bottom: 20px; font-size: 2.5em; }
    h2 { color: #34495e; margin-bottom: 15px; }
    form { display: flex; flex-direction: column; gap: 15px; margin-bottom: 40px; }
    input[type="text"], input[type="number"], select {
      padding: 10px 15px; border-radius: 8px; border: 1px solid #ccc; font-size: 1em;
    }
    button {
      padding: 12px; border: none; border-radius: 8px; font-size: 1.1em;
      background: linear-gradient(to right, #3498db, #2980b9); color: #fff; cursor: pointer; transition: 0.3s;
    }
    button:hover { background: linear-gradient(to right, #2980b9, #3498db); }
    .summary-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 30px;
    }
    .card {
      background-color: #ecf0f1; padding: 15px; border-radius: 10px; text-align: center; font-weight: bold;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05); transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-5px); }
    .Food { background-color: #f39c12; color: #fff; }
    .Home { background-color: #16a085; color: #fff; }
    .Work { background-color: #2980b9; color: #fff; }
    .Fun { background-color: #8e44ad; color: #fff; }
    .Other { background-color: #2c3e50; color: #fff; }
    .budget-info {
      display: flex; justify-content: space-between; background-color: #f7f9fa;
      padding: 15px 20px; border-radius: 10px; font-size: 1.1em; margin-bottom: 20px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.03);
    }
    .full-budget-btn {
      display: block; width: 220px; margin: 0 auto 30px auto;
      padding: 12px; background-color: #27ae60; color: white; text-align: center;
      border-radius: 8px; font-size: 1.1em; cursor: pointer; text-decoration: none; transition: 0.3s;
    }
    .full-budget-btn:hover { background-color: #1e8449; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Expense Tracker</h1>
    <h3 style="text-align: center">(A demo project)</h3>

    <h2>Add Expense</h2>
    <form method="POST">
      <input type="text" name="name" placeholder="Expense Name" required>
      <input type="number" name="amount" step="0.01" placeholder="Amount" required>
      <select name="category">
        {% for cat in categories %}
          <option value="{{ cat }}">{{ cat }}</option>
        {% endfor %}
      </select>
      <button type="submit">Add Expense</button>
    </form>

    <a href="{{ url_for('full_budget') }}" class="full-budget-btn">View Full Budget</a>

    <h2>Summary By Category</h2>
    <div class="summary-grid">
      {% for cat, amount in summary[0].items() %}
        <div class="card {{ cat }}">
          {{ cat }}<br>Rs.{{ amount }}
        </div>
      {% endfor %}
    </div>

    <div class="budget-info">
      <div>Total Spent: Rs.{{ summary[1] }}</div>
      <div>Remaining Budget: Rs.{{ summary[2] }}</div>
      <div>Daily Budget Left: Rs.{{ summary[3] }}</div>
    </div>
  </div>
</body>
</html>
